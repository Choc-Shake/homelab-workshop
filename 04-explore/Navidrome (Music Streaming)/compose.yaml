# Navidrome: see README.md in this folder

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: "1m"   # rescan every minute, nice for testing
    volumes:
      - ./data:/data
      - ./music:/music:ro
    restart: unless-stopped
