# Portainer: see README.md in this folder

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # gives it control of Docker, see notes
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data:
