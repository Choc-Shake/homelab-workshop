<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My first server</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { max-width: 36rem; padding: 2rem; }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
    code { background: #1e293b; padding: .15rem .4rem; border-radius: 4px; }
    .tag { color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Level Up!! Workshops</p>
    <h1>Hello from YOUR NAME's server</h1>
    <p>This page is served by an <code>nginx</code> container running on my laptop.</p>
    <p>Edit <code>crash-course/site/index.html</code>, save, and refresh. It updates straight away
       because the container reads this folder through a volume.</p>
  </main>
</body>
</html>
